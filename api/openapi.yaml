                        type: integer
                      serverRevision:
                        type: integer
                        minimum: 0
                    required:
                      - user
                      - expiresAt
                      - serverRevision
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                  - data
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
