  /entries:
    post:
      operationId: entries.create
      summary: Criar entrada (PII → gravação → embedding, com idempotência RF10)
      security:
        - bearerAuth: []
      x-cerne-function: entries-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 20000
                source:
                  type: string
                  enum:
                    - manual
                    - audio
                    - photo
                    - chat
                chatMessageId:
                  type: string
                  format: uuid
                occurredAt:
                  type: string
                  format: date-time
                mediaDurationSeconds:
                  type: integer
                  minimum: 0
              required:
                - content
                - source
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      content:
                        type: string
                        minLength: 1
                        maxLength: 20000
                      source:
                        type: string
                        enum:
                          - manual
                          - audio
                          - photo
                          - chat
                      chatMessageId:
                        type: string
                        format: uuid
                        nullable: true
                      occurredAt:
                        type: string
                        format: date-time
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                          required:
                            - id
                            - name
                      piiStatus:
                        type: string
                        enum:
                          - pending
                          - clean
                          - flagged
                          - failed
                      piiSpans:
                        type: array
                        items:
                          type: object
                          properties:
                            start:
                              type: integer
                              minimum: 0
                            end:
                              type: integer
                              minimum: 0
                            type:
                              type: string
                          required:
                            - start
                            - end
                            - type
                      embeddingStatus:
                        type: string
                        enum:
                          - pending
                          - ready
                          - failed
                      mediaDurationSeconds:
                        type: integer
                        minimum: 0
                        nullable: true
                      serverRevision:
                        type: integer
                        minimum: 0
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - content
                      - source
                      - chatMessageId
                      - occurredAt
                      - tags
                      - piiStatus
                      - piiSpans
                      - embeddingStatus
                      - mediaDurationSeconds
                      - serverRevision
                      - createdAt
                      - updatedAt
                  meta:
                    type: object
                    properties:
                      idempotentReplay:
                        type: boolean
                required:
                  - data
                  - meta
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: entries.list
      summary: Listar entradas, paginado, com tags embutidas
      security:
        - bearerAuth: []
      x-cerne-function: entries-list
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - manual
              - audio
              - photo
              - chat
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        content:
                          type: string
                          minLength: 1
                          maxLength: 20000
                        source:
                          type: string
                          enum:
                            - manual
                            - audio
                            - photo
                            - chat
                        chatMessageId:
                          type: string
                          format: uuid
                          nullable: true
                        occurredAt:
                          type: string
                          format: date-time
                        tags:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                            required:
                              - id
                              - name
                        piiStatus:
                          type: string
                          enum:
                            - pending
                            - clean
                            - flagged
                            - failed
                        piiSpans:
                          type: array
                          items:
                            type: object
                            properties:
                              start:
                                type: integer
                                minimum: 0
                              end:
                                type: integer
                                minimum: 0
                              type:
                                type: string
                            required:
                              - start
                              - end
                              - type
                        embeddingStatus:
                          type: string
                          enum:
                            - pending
                            - ready
                            - failed
                        mediaDurationSeconds:
                          type: integer
                          minimum: 0
                          nullable: true
                        serverRevision:
                          type: integer
                          minimum: 0
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - content
                        - source
                        - chatMessageId
                        - occurredAt
                        - tags
                        - piiStatus
                        - piiSpans
                        - embeddingStatus
                        - mediaDurationSeconds
                        - serverRevision
                        - createdAt
                        - updatedAt
                  meta:
                    type: object
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                      total:
                        type: integer
                        minimum: 0
                    required:
                      - nextCursor
                required:
                  - data
                  - meta
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
