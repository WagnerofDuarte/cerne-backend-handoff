                          - refreshToken
                          - expiresIn
                          - expiresAt
                          - tokenType
                        additionalProperties: {}
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                        required:
                          - id
                          - email
                        additionalProperties: {}
                    required:
                      - session
                      - user
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                  - data
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/refresh:
    post:
      operationId: auth.refresh
      summary: Refresh de token — proxy fino do GoTrue
      security: []
      x-cerne-function: auth-refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: integer
                          expiresAt:
                            type: integer
                          tokenType:
                            type: string
                        required:
                          - accessToken
                          - refreshToken
                          - expiresIn
                          - expiresAt
                          - tokenType
                        additionalProperties: {}
                    required:
                      - session
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                  - data
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/session:
