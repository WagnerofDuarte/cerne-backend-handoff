  /dashboard/aggregate:
    get:
      operationId: dashboard.aggregate.get
      summary: Agregado do período — sempre 200, inclusive com zero entradas
      security:
        - bearerAuth: []
      x-cerne-function: dashboard-aggregate-get
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - all
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      buckets:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                            count:
                              type: integer
                              minimum: 0
                            sources:
                              type: object
                              properties:
                                manual:
                                  type: integer
                                  minimum: 0
                                audio:
                                  type: integer
                                  minimum: 0
                                photo:
                                  type: integer
                                  minimum: 0
                                chat:
                                  type: integer
                                  minimum: 0
                              required:
                                - manual
                                - audio
                                - photo
                                - chat
                          required:
                            - date
                            - count
                            - sources
                      totals:
                        type: object
                        properties:
                          count:
                            type: integer
                            minimum: 0
                          sources:
                            type: object
                            properties:
                              manual:
                                type: integer
                                minimum: 0
                              audio:
                                type: integer
                                minimum: 0
                              photo:
                                type: integer
                                minimum: 0
                              chat:
                                type: integer
                                minimum: 0
                            required:
                              - manual
                              - audio
                              - photo
                              - chat
                        required:
                          - count
                          - sources
                    required:
                      - buckets
                      - totals
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                  - data
