# GERADO por scripts/gen-openapi.ts a partir de contracts/zod/ — não editar à mão.
# Para regenerar: deno run -A scripts/gen-openapi.ts

openapi: 3.0.3
info:
  title: Cerne Backend API
  description: >-
    GERADO por scripts/gen-openapi.ts a partir de contracts/zod/ (T-026) — não editar à mão.


    **Como montar a URL real (D-01):** não existe roteador — cada operação é servida por uma Edge
    Function própria, uma por endpoint. O `path` de cada operação abaixo é só notação REST do
    contrato; a URL de verdade é `{FUNCTIONS_BASE_URL}/<x-cerne-function>/<parâmetros de path, na
    mesma ordem em que aparecem no `path`, como segmentos finais>` — qualquer segmento literal do
    `path` depois do último parâmetro (ex.: o `/retry` de
    `/chat/sessions/{id}/messages/{userMessageId}/retry`) NÃO aparece na URL real. Cada operação
    carrega o nome da função em `x-cerne-function`; a tabela completa caminho→função está em
    `docs/handoff/README.md`.
  version: 1.0.0
servers:
  - url: "{FUNCTIONS_BASE_URL}"
    variables:
      FUNCTIONS_BASE_URL:
        default: https://<project-ref>.functions.supabase.co
        description: Base das Edge Functions do ambiente (dev/ciclo-a/ciclo-b) — o `project ref` de cada
          ambiente está no pacote de credenciais (`credenciais/README.md`), nunca neste arquivo
          gerado.
paths:
  /auth/signup:
    post:
      operationId: auth.signup
      summary: Cadastro — proxy fino do GoTrue
      security: []
      x-cerne-function: auth-signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: integer
                          expiresAt:
                            type: integer
                          tokenType:
                            type: string
                        required:
                          - accessToken
                          - refreshToken
                          - expiresIn
                          - expiresAt
                          - tokenType
                        additionalProperties: {}
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                        required:
                          - id
                          - email
                        additionalProperties: {}
                    required:
                      - session
                      - user
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                  - data
        default:
          description: Erro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: auth.login
      summary: Login — proxy fino do GoTrue
      security: []
      x-cerne-function: auth-login
      requestBody:
        required: true
