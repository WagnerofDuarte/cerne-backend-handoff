components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - AUTH_EXPIRED
            - AUTH_INVALID
            - NETWORK_TIMEOUT
            - NETWORK_OFFLINE
            - VALIDATION_ERROR
            - PII_CHECK_FAILED
            - EMBEDDING_FAILED
            - AI_GENERATION_TIMEOUT
            - NOT_FOUND
            - RATE_LIMITED
            - EXPORT_EMPTY_PERIOD
            - PAYLOAD_TOO_LARGE
            - OCR_NO_TEXT
        message:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
      required:
        - code
        - message
        - retryable
        - requestId
